[package]
name = "recentlydivorced-hook"
version = "0.3.12"
edition = "2024"
license = "MIT"
description = "Codex resume labeler for RecentlyDivorced"

[[bin]]
name = "recentlydivorced"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
