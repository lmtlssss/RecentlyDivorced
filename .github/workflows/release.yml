name: release-plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build hook helper
        run: cargo build --release --locked --manifest-path plugins/recentlydivorced/runtime/Cargo.toml
      - name: publish helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install -m 0755 plugins/recentlydivorced/runtime/target/release/recentlydivorced recentlydivorced-x86_64-unknown-linux-gnu
          gh release create "${{ inputs.tag }}" recentlydivorced-x86_64-unknown-linux-gnu --title "${{ inputs.tag }}" --generate-notes
