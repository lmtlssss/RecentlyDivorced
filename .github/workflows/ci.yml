name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path plugins/recentlydivorced/runtime/Cargo.toml
      - run: cargo build --locked --manifest-path plugins/recentlydivorced/runtime/Cargo.toml
      - name: prove isolated title lifecycle
        run: python3 scripts/prove-labels.py
      - run: python3 -m json.tool plugins/recentlydivorced/.codex-plugin/plugin.json >/dev/null
      - run: python3 -m json.tool plugins/recentlydivorced/hooks/hooks.json >/dev/null
