[package]
name = "recentlydivorced"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Linux Codex resume-preview manager"

[[bin]]
name = "recentlydivorced"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3.12"
